{% extends 'base.html' %}
{% block title %}Eliminar libro — LibroLibre{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Eliminar libro</h2>
    <p>¿Estás seguro de eliminar <strong>{{ libro.titulo }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Eliminar</button>
        <a href="{% url 'detalle_libro' libro.id %}" class="btn-primary">Cancelar</a>
    </form>
</div>
{% endblock %}
